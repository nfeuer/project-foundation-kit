# Library archetype — reusable package published to a registry (PyPI, npm, crates.io, etc.).
# No deployment, no migrations, no UI, no LLM. Gate focus: code quality, coverage,
# dep-audit, doc-sync, secret-scan, config-consistency, and follow-up tracking.
# Alerts are off; nothing to page about at library publish time.

preset: "library"

gates:
  strictness: "standard"    # prototype | standard | production — see docs/PROFILE.md

# --- Model routing: which model executes which shape of step ---
# Skills name a role (code | plan | mechanical), never a bare model ID — same
# convention as `toolchain.test`. Empty string ("") = no preference; run the
# step on whatever model is already executing.
models:
  code:       "claude-sonnet-5"   # edits, fixes, migrations, generated artifacts
  code_light: "claude-sonnet-5"   # same work, smaller diffs / cheaper runs
  plan:       "claude-fable-5"    # planning, validation, review: adr, session-handoff, review agents
  mechanical: "claude-haiku-4-5"  # deterministic checks: greps, file existence, manifest diffs
  effort:
    code:       "high"            # low | medium | high | xhigh | max
    plan:       "high"
    mechanical: "low"

toolchain:
  lint:             "uv run ruff check src/ tests/"
  format:           "ruff format"
  typecheck:        "uv run mypy src/"
  test:             "uv run pytest tests/ -m 'not slow' --tb=short -q"
  test_integration: ""                  # no integration surface; flip on if needed
  build:            "uv build"          # produce the sdist/wheel
  install:          "uv sync --dev"

capabilities:
  migrations:
    enabled: false
    heads_cmd: ""
    versions_glob: ""
  ui:
    enabled: false
    build_cmd: ""
    typecheck_cmd: ""
  llm:
    enabled: false
    eval_dir: ""
    spend_table: ""
  spec:
    file: ""                            # no canonical spec; set to "SPEC.md" if you add one
    section_marker: "§"
  docs:
    enabled: true
    dir: "docs"
  coverage:
    ratchet_enabled: true
    baseline_file: ".coverage-baseline"

logging:
  initialized: false        # run logging-init: probe → 3 questions → wire
  library: ""
  destination: "stdout"
  dev_console: true

alerts:
  channel: "none"
  target: ""
